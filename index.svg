
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%"
     viewBox="0 0 1280 720"
     preserveAspectRatio="xMidYMid slice">

  <foreignObject x="0" y="0" width="1280" height="720">
    <div xmlns="http://www.w3.org/1999/xhtml"
         class="page">

      <style>
        * {
          box-sizing: border-box;
        }

        html, body, .page {
          margin: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          font-family: Arial, Helvetica, sans-serif;
          background: #080808;
          color: white;
        }

        .background {
          position: fixed;
          width: 150vmax;
          height: 150vmax;
          left: 50%;
          top: 50%;
          object-fit: cover;
          transform: translate(-50%, -50%);
          animation: spin 35s linear infinite;
          opacity: .72;
          pointer-events: none;
        }

        @keyframes spin {
          from {
            transform: translate(-50%, -50%) rotate(0deg);
          }
          to {
            transform: translate(-50%, -50%) rotate(360deg);
          }
        }

        .shade {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse at center,
              transparent 5%, rgba(0,0,0,.5) 65%,
              rgba(0,0,0,.88) 100%),
            linear-gradient(0deg,
              rgba(0,0,0,.8), transparent 65%);
        }

        .topbar {
          position: absolute;
          left: 32px;
          right: 32px;
          top: 26px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 15px 20px;
          background: rgba(10,10,10,.6);
          border: 1px solid rgba(255,255,255,.2);
          border-radius: 14px;
          backdrop-filter: blur(12px);
        }

        .brand {
          font-size: 15px;
          font-weight: 900;
          letter-spacing: 4px;
          text-transform: uppercase;
        }

        .status {
          color: #b6b6b6;
          font-size: 11px;
          letter-spacing: 2px;
        }

        .center {
          position: absolute;
          left: 0;
          right: 0;
          top: 50%;
          transform: translateY(-50%);
          text-align: center;
          padding: 24px;
        }

        .eyebrow {
          font-size: 11px;
          letter-spacing: 7px;
          color: #d5d5d5;
          margin-bottom: 17px;
        }

        h1 {
          font-size: clamp(42px, 8vw, 94px);
          line-height: .95;
          letter-spacing: -5px;
          margin: 0;
          font-weight: 950;
          text-transform: uppercase;
          text-shadow: 0 8px 35px #000;
        }

        .subtitle {
          color: #d0d0d0;
          font-size: 13px;
          letter-spacing: 3px;
          margin-top: 22px;
        }

        .games {
          margin-top: 35px;
          position: relative;
          padding: 17px 36px;
          color: white;
          background: rgba(15,15,15,.78);
          border: 1px solid rgba(255,255,255,.7);
          border-radius: 8px;
          font-size: 12px;
          font-weight: bold;
          letter-spacing: 4px;
          cursor: pointer;
          transition: .25s ease;
          box-shadow: 0 0 25px rgba(0,0,0,.4);
        }

        .games:hover {
          background: white;
          color: black;
          transform: translateY(-3px);
          box-shadow: 0 0 35px rgba(255,255,255,.25);
        }

        .bottom {
          position: absolute;
          bottom: 24px;
          left: 32px;
          right: 32px;
          display: flex;
          justify-content: space-between;
          color: #aaa;
          font-size: 10px;
          letter-spacing: 2px;
        }

        @media (max-width: 600px) {
          .topbar {
            left: 14px;
            right: 14px;
            top: 14px;
          }

          h1 {
            letter-spacing: -2px;
          }

          .bottom {
            left: 16px;
            right: 16px;
            font-size: 8px;
          }
        }
      </style>

      <img class="background"
           src="https://cdn.jsdelivr.net/gh/webstashdude/lucas@latest/lucas.jpg"
           alt="" />

      <div class="shade"></div>

      <header class="topbar">
        <div class="brand">LUCAS'S LODGE</div>
        <div class="status">● ONLINE</div>
      </header>

      <main class="center">
        <div class="eyebrow">WELCOME TO THE LODGE</div>
        <h1>Lucas's<br/>Lodge</h1>
        <div class="subtitle">
          YOUR LITTLE CORNER OF THE INTERNET
        </div>

        <button class="games" id="gamesButton">
          ↗ &#160; GAMES
        </button>
      </main>

      <footer class="bottom">
        <span>LL / EST. WHATEVER</span>
        <span>STAY A WHILE.</span>
      </footer>

      <script>
        document.getElementById('gamesButton')
          .addEventListener('click', function () {
            const tab = window.open('about:blank', '_blank');

            if (!tab) {
              alert('Your browser blocked the new tab. Allow pop-ups and try again.');
              return;
            }

            tab.document.open();
            tab.document.write(`<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090909;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #090909;
    }
  </style>
</head>
<body>
  <iframe
    src="https://s3.amazonaws.com/prageru-server/mathematics.html"
    allowfullscreen>
  </iframe>
</body>
</html>`);
            tab.document.close();
          });
      </script>

    </div>
  </foreignObject>
</svg>
